<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>四级打卡日志</title>
<style>
:root{--bg:#f5f5f7;--card:rgba(255,255,255,.82);--text:#111114;--muted:#6e6e73;--line:rgba(0,0,0,.08);--blue:#007aff;--green:#34c759;--red:#ff3b30;--shadow:0 10px 30px rgba(0,0,0,.07);--r:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,#fafafa 0,#f2f2f7 62%,#ededf2 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;min-height:100vh}
.app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.header{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 4px 18px}.eyebrow{font-size:13px;color:var(--muted);font-weight:650;margin-bottom:5px}.title{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-1.3px}.today{font-size:12px;color:var(--muted);text-align:right}
.card{background:var(--card);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--shadow);border-radius:var(--r);padding:18px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:rgba(118,118,128,.08);border-radius:18px;padding:13px}.num{font-size:26px;font-weight:800;letter-spacing:-.5px}.lbl{font-size:12px;color:var(--muted);margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-title{font-size:18px;font-weight:780}.section-sub{font-size:12px;color:var(--muted);margin-top:3px}
label{display:block;font-size:13px;color:var(--muted);font-weight:650;margin:13px 0 7px 2px}input,textarea{width:100%;border:1px solid var(--line);background:rgba(118,118,128,.06);border-radius:15px;padding:13px 14px;font:inherit;color:var(--text);outline:none;transition:.18s}input:focus,textarea:focus{background:#fff;border-color:rgba(0,122,255,.4);box-shadow:0 0 0 4px rgba(0,122,255,.08)}input[type=number]{appearance:textfield}textarea{min-height:100px;resize:vertical}
.status{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:750;background:rgba(118,118,128,.1);color:#555}.status.good{background:rgba(52,199,89,.13);color:#208a3a}.status.mid{background:rgba(255,159,10,.13);color:#a86400}.status.low{background:rgba(255,59,48,.12);color:#c52a20}
.btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.btn{border:0;border-radius:16px;padding:12px 15px;font:inherit;font-weight:730;cursor:pointer}.primary{background:#111;color:#fff}.blue{background:var(--blue);color:#fff}.soft{background:rgba(118,118,128,.10);color:var(--text)}.danger{background:rgba(255,59,48,.10);color:#c52a20}
.log-list{display:grid;gap:10px;margin-top:12px}.log{padding:14px;border-radius:18px;background:rgba(118,118,128,.06);border:1px solid var(--line)}.log-head{display:flex;align-items:center;gap:9px}.log-date{font-weight:800;min-width:62px}.log-grade{font-size:11px;padding:5px 8px;border-radius:999px;font-weight:800;background:rgba(118,118,128,.1);color:#555}.log-grade.good{background:rgba(52,199,89,.13);color:#208a3a}.log-grade.mid{background:rgba(255,159,10,.13);color:#a86400}.log-grade.low{background:rgba(255,59,48,.12);color:#c52a20}.log-content{color:#4d4d52;font-size:12px;line-height:1.55;margin-top:8px}.log-content b{color:#222}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(728px,calc(100% - 26px));display:flex;gap:8px;padding:8px;background:rgba(255,255,255,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.75);border-radius:22px;box-shadow:0 12px 35px rgba(0,0,0,.12);z-index:20}.bottom button{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.36);display:none;align-items:flex-end;justify-content:center;z-index:40}.sheet{width:min(760px,100%);background:#f8f8fb;border-radius:28px 28px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}.handle{width:38px;height:5px;border-radius:999px;background:#d1d1d6;margin:3px auto 15px}.sheet h3{margin:0 0 12px;font-size:20px}.code{background:#111;color:#fff;border-radius:16px;padding:13px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow:auto}.actions{display:flex;gap:9px;margin-top:12px}.actions .btn{flex:1}
@media(max-width:560px){.title{font-size:31px}.stats{gap:8px}.stat{padding:11px}.num{font-size:23px}}
</style>
</head>
<body>
<div class="app">
  <div class="header"><div><div class="eyebrow">CET-4 · 2026.12.12</div><div class="title">打卡日志</div></div><div class="today" id="todayLabel"></div></div>
  <div class="card"><div class="stats"><div class="stat"><div class="num" id="streak">0</div><div class="lbl">连续打卡</div></div><div class="stat"><div class="num" id="days">0</div><div class="lbl">累计天数</div></div><div class="stat"><div class="num" id="wordsTotal">0</div><div class="lbl">累计新词</div></div></div></div>
  <div class="card">
    <div class="row"><div><div class="section-title">今天学了什么</div><div class="section-sub">只记录实际完成内容，不按计划限制</div></div><div id="status" class="status">未记录</div></div>
    <label>日期</label><input id="date" type="date">
    <label>单词</label><input id="words" type="number" min="0" inputmode="numeric" placeholder="今天新背了多少词？">
    <label>语法</label><input id="grammar" placeholder="今天学了什么语法？学到哪？">
    <label>做的哪的题</label><input id="question" placeholder="例如：2025.12 真题2 仔细阅读">
    <label>真题 / 专项</label><input id="paper" placeholder="例如：长篇阅读专项、翻译专项、真题听力……">
    <label>今日总结</label><textarea id="summary" placeholder="今天做得怎么样、哪里不会、明天注意什么……"></textarea>
    <div class="btns"><button class="btn blue" id="saveBtn">保存打卡</button><button class="btn soft" id="resetTodayBtn">重置今天</button></div>
  </div>
  <div class="card"><div class="row"><div><div class="section-title">最近记录</div><div class="section-sub">每条都可删除，也可重新编辑某一天</div></div><button class="btn soft" id="openExport">导出</button></div><div class="log-list" id="logList"></div></div>
</div>
<div class="bottom"><button class="btn soft" id="importBtn">导入数据</button><button class="btn primary" id="aiBtn">生成 AI 统计</button><button class="btn danger" id="resetAllBtn">清空全部</button></div>
<input type="file" id="fileInput" accept="application/json,.json" hidden>
<div class="modal" id="modal"><div class="sheet"><div class="handle"></div><h3>发给 AI 的统计数据</h3><div class="code" id="exportText"></div><div class="actions"><button class="btn blue" id="copyBtn">复制</button><button class="btn soft" id="downloadBtn">下载 JSON</button><button class="btn soft" id="closeBtn">关闭</button></div></div></div>
<script>
const $=id=>document.getElementById(id),KEY='cet4_checkin_v2';
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const load=()=>{try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}};
const saveAll=a=>localStorage.setItem(KEY,JSON.stringify(a));
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
function grade(x){let score=0;if((+x.words||0)>0)score+=35;if(String(x.grammar||'').trim())score+=20;if(String(x.question||'').trim())score+=15;if(String(x.paper||'').trim())score+=15;if(String(x.summary||'').trim())score+=15;if(score>=85)return ['优秀','good',score];if(score>=65)return ['良好','good',score];if(score>=45)return ['合格','mid',score];return ['较少','low',score]}
function fill(x){$('words').value=x?.words||'';$('grammar').value=x?.grammar||'';$('question').value=x?.question||'';$('paper').value=x?.paper||'';$('summary').value=x?.summary||'';updateStatus(x||{date:$('date').value})}
function clearToday(){ $('date').value=today();fill(null); }
function current(){return load().find(x=>x.date===$('date').value)}
function updateStatus(x){const st=$('status');if(!x||!['words','grammar','question','paper','summary'].some(k=>String(x[k]??'').trim() || (+x[k]||0)>0)){st.textContent='未记录';st.className='status';return}const g=grade(x);st.textContent=g[0];st.className='status '+g[1]}
function calc(){const a=load().sort((x,y)=>x.date.localeCompare(y.date));let streak=0,cur=new Date();while(true){const d=new Date(cur.getTime()-cur.getTimezoneOffset()*60000).toISOString().slice(0,10);if(a.some(x=>x.date===d)){streak++;cur.setDate(cur.getDate()-1)}else break}return {days:a.length,streak,words:a.reduce((s,x)=>s+(+x.words||0),0)}}
function render(){const a=load().sort((x,y)=>y.date.localeCompare(x.date)),c=calc();$('streak').textContent=c.streak;$('days').textContent=c.days;$('wordsTotal').textContent=c.words;$('todayLabel').textContent=$('date').value||today();const list=a.slice(0,12);$('logList').innerHTML=list.length?list.map(x=>{const g=grade(x);return `<div class="log"><div class="log-head"><div class="log-date">${esc(x.date.slice(5))}</div><span class="log-grade ${g[1]}">${g[0]}</span><button class="btn soft" style="margin-left:auto;padding:7px 10px" data-edit="${esc(x.date)}">编辑</button><button class="btn danger" style="padding:7px 10px" data-del="${esc(x.date)}">删除</button></div><div class="log-content"><b>单词</b> ${x.words||0}<br><b>语法</b> ${esc(x.grammar||'—')}<br><b>做题</b> ${esc(x.question||'—')}<br><b>真题/专项</b> ${esc(x.paper||'—')}<br><b>总结</b> ${esc(x.summary||'—')}</div></div>`}).join(''):'<div class="empty">还没有打卡记录</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{$('date').value=b.dataset.edit;fill(current());render();window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const d=b.dataset.del;if(confirm('删除 '+d+' 这条记录？')){saveAll(load().filter(x=>x.date!==d));if($('date').value===d)clearToday();render()}});updateStatus(current())}
$('date').value=today();fill(current());render();$('date').onchange=()=>{fill(current());render()};
$('saveBtn').onclick=()=>{const date=$('date').value||today();const item={date,words:Math.max(0,+$('words').value||0),grammar:$('grammar').value.trim(),question:$('question').value.trim(),paper:$('paper').value.trim(),summary:$('summary').value.trim()};if(!item.words&&!item.grammar&&!item.question&&!item.paper&&!item.summary){alert('至少记录一项今天做的内容');return}const a=load().filter(x=>x.date!==date);a.push(item);saveAll(a);render();alert('打卡已保存')};
$('resetTodayBtn').onclick=()=>{const d=$('date').value||today();if(confirm('重置 '+d+' 的数据？')){saveAll(load().filter(x=>x.date!==d));clearToday();render()}};
$('resetAllBtn').onclick=()=>{if(confirm('清空全部历史打卡？此操作不可撤销。')){saveAll([]);clearToday();render()}};
$('aiBtn').onclick=()=>{const a=load().sort((x,y)=>x.date.localeCompare(y.date));const c=calc();const lines=a.map(x=>{const g=grade(x);return `${x.date}｜评级：${g[0]}（${g[2]}分）｜单词：${x.words||0}｜语法：${x.grammar||'未记录'}｜做题：${x.question||'未记录'}｜真题/专项：${x.paper||'未记录'}｜总结：${x.summary||'未记录'}`});$('exportText').textContent=`英语四级打卡统计\n考试：2026-12-12\n目标：425+\n累计打卡：${c.days} 天\n连续打卡：${c.streak} 天\n累计新词：${c.words}\n\n${lines.join('\n')||'暂无记录'}`;$('modal').style.display='flex'};
$('openExport').onclick=()=>$('aiBtn').click();$('closeBtn').onclick=()=>$('modal').style.display='none';$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').style.display='none'};
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('exportText').textContent);$('copyBtn').textContent='已复制';setTimeout(()=>$('copyBtn').textContent='复制',1200)}catch{alert('复制失败，请手动长按复制')}};
$('downloadBtn').onclick=()=>{const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cet4-checkin-${today()}.json`;a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const incoming=JSON.parse(r.result);if(!Array.isArray(incoming))throw 0;const merged=load();incoming.forEach(it=>{if(!it.date)return;const i=merged.findIndex(x=>x.date===it.date);if(i>=0)merged[i]=it;else merged.push(it)});saveAll(merged);clearToday();render();alert('导入成功')}catch{alert('JSON格式不正确')}};r.readAsText(f);e.target.value=''};
</script>
</body>
</html>
